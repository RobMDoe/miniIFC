{% extends "layout.html" %}

{% block title %}
    viewport
{% endblock %}

{% block main %}

  <!--CSS fills browser viewport. Use CSS here to change things-->
  <style>
        
    html, body {
      height: 100%;
      margin: 0;
    }
    /* make the canvas fill its container */
    #mycanvas {
      width: 100%;
      height: 100%;
      display: block;
    }


  </style>
   
  <script src="https://webgl2fundamentals.org/webgl/resources/webgl-utils.js"></script>
  <script src="https://webgl2fundamentals.org/webgl/resources/m3.js"></script>


  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168/examples/jsm/"
      }
    }
  </script>
  
  <script src="../static/render.js" type="module"></script>

  <canvas id="mycanvas" width="1110" height="400"></canvas>
  
{% endblock %}
